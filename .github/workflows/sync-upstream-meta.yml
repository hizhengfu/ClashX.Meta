name: Sync upstream meta

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-meta
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.upstream.outputs.upstream_tag }}
      core_tag: ${{ steps.upstream.outputs.core_tag }}
      release_tag: ${{ steps.upstream.outputs.release_tag }}
      release_exists: ${{ steps.release.outputs.exists }}

    steps:
      - name: Resolve upstream version
        id: upstream
        run: |
          upstream_tag="$(git ls-remote --tags --refs https://github.com/MetaCubeX/ClashX.Meta.git 'v*' | awk '{print $2}' | sed 's#refs/tags/##' | sort -V | tail -n1)"
          if [ -z "$upstream_tag" ]; then
            echo "No upstream version tag found."
            exit 1
          fi

          core_tag="$(git ls-remote --tags --refs https://github.com/MetaCubeX/mihomo.git 'v*' | awk '{print $2}' | sed 's#refs/tags/##' | sort -V | tail -n1)"
          if [ -z "$core_tag" ]; then
            echo "No mihomo version tag found."
            exit 1
          fi

          release_tag="${upstream_tag}+"
          {
            echo "upstream_tag=$upstream_tag"
            echo "core_tag=$core_tag"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream tag: $upstream_tag"
          echo "Core tag: $core_tag"
          echo "Release tag: $release_tag"

      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.upstream.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists; skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-release:
    runs-on: macos-26
    needs: resolve
    if: needs.resolve.outputs.release_exists != 'true'

    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout meta
        uses: actions/checkout@v4
        with:
          ref: meta
          fetch-depth: 0
          persist-credentials: false

      - name: Verify upstream version is merged
        env:
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
        run: |
          git fetch --no-tags https://github.com/MetaCubeX/ClashX.Meta.git "refs/tags/$UPSTREAM_TAG"
          upstream_commit="$(git rev-parse "FETCH_HEAD^{commit}")"
          if ! git merge-base --is-ancestor "$upstream_commit" HEAD; then
            echo "Upstream $UPSTREAM_TAG is not merged into this repository's meta branch."
            echo "Merge upstream meta first, then run this workflow again."
            exit 1
          fi

      - name: Download meta core
        uses: robinraju/release-downloader@v1.12
        with:
          repository: MetaCubeX/mihomo
          tag: ${{ needs.resolve.outputs.core_tag }}
          fileName: mihomo-darwin-???64-${{ needs.resolve.outputs.core_tag }}.gz
          out-file-path: clash.meta

      - name: Build infos
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          core_archive="$(find clash.meta -maxdepth 1 -type f -name '*.gz' -print -quit)"
          if [ -z "$core_archive" ]; then
            echo "No mihomo archive downloaded."
            exit 1
          fi

          core_version="$(printf '%s\n' "$core_archive" | sed -ne 's/.*64-\(.*\).gz/\1/p')"
          if build_number="$(git rev-list --count origin/master..origin/meta 2>/dev/null)"; then
            :
          else
            build_number="$(git rev-list --count HEAD)"
          fi

          /usr/libexec/PlistBuddy -c "Set CFBundleVersion $build_number" ClashX/Info.plist
          /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $RELEASE_TAG" ClashX/Info.plist
          /usr/libexec/PlistBuddy -c "Add coreVersion string $core_version" ClashX/Info.plist
          /usr/libexec/PlistBuddy -c "Add gitBranch string meta" ClashX/Info.plist
          /usr/libexec/PlistBuddy -c "Add gitCommit string $(git rev-parse --short HEAD)" ClashX/Info.plist
          /usr/libexec/PlistBuddy -c "Add buildTime string $(date +%Y-%m-%d\ %H:%M)" ClashX/Info.plist

          /usr/libexec/PlistBuddy -c 'Print CFBundleVersion' ClashX/Info.plist
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' ClashX/Info.plist
          /usr/libexec/PlistBuddy -c 'Print coreVersion' ClashX/Info.plist
          /usr/libexec/PlistBuddy -c 'Print gitBranch' ClashX/Info.plist
          /usr/libexec/PlistBuddy -c 'Print gitCommit' ClashX/Info.plist
          /usr/libexec/PlistBuddy -c 'Print buildTime' ClashX/Info.plist

      - name: Install deps
        run: |
          bash install_dependency.sh
          xcodebuild -resolvePackageDependencies -project ClashX.xcodeproj

      - name: Build
        run: |
          xcodebuild archive -project ClashX.xcodeproj -scheme ClashX\ Meta -archivePath archive/ClashX.xcarchive -showBuildTimingSummary -allowProvisioningUpdates

      - name: Create zip
        run: ditto -c -k --sequesterRsrc --keepParent archive/ClashX.xcarchive/Products/Applications/ClashX\ Meta.app "ClashX Meta.zip"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          name: ${{ needs.resolve.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Built from upstream MetaCubeX/ClashX.Meta ${{ needs.resolve.outputs.upstream_tag }}.
            Core: MetaCubeX/mihomo ${{ needs.resolve.outputs.core_tag }}.
            Version string: ${{ needs.resolve.outputs.release_tag }}
          files: |
            ClashX Meta.zip
